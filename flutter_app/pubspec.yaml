name: slokun_frontend
description: Slökun frontend MVP
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_riverpod: ^2.0.0
  dio: ^5.0.0
  flutter_dotenv: ^5.0.2
  google_maps_flutter: ^2.2.0
  intl: ^0.18.0
  easy_localization: ^4.0.0
  geolocator: ^9.0.2
  firebase_core: ^2.10.0
  firebase_auth: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/lang/
    - assets/images/
